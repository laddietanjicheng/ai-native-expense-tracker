# Development overrides, applied automatically by `docker compose up`.
# Source folders are mounted into the containers and both servers reload on change.
# Production-style run: docker compose -f docker-compose.yml up --build
services:
  backend:
    command: >
      sh -c "alembic upgrade head && python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      # File events from Windows bind mounts don't reach Linux containers; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/code
      - /code/.venv

  frontend:
    build:
      target: dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
